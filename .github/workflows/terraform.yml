name: Terraform

on:
  push:
    branches:
      - main
    paths: &terraform_paths
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths: *terraform_paths

permissions:
  contents: read

jobs:
  validate:
    name: Format, validate, and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.4

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform test
        run: terraform test -no-color

      - name: Trivy Terraform security scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: terraform
          hide-progress: true
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Checkov Terraform security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Render Terraform plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/plan.txt
          retention-days: 7

      - name: Comment Terraform plan
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan-comment -->";
            const plan = fs.readFileSync("terraform/plan.txt", "utf8");
            const maxLength = 60000;
            const truncated = plan.length > maxLength
              ? `${plan.slice(0, maxLength)}\n\n...plan output truncated. Download the terraform-plan artifact for the full plan.`
              : plan;

            const body = [
              marker,
              "## Terraform Plan",
              "",
              "```terraform",
              truncated,
              "```",
              "",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.data.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
